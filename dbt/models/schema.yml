version: 2
models:
  - name: dim_customer_scd2
    description: Full customer history with half-open validity intervals in UTC.
    columns:
      - name: customer_version_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
  - name: fact_orders
    description: Orders joined to the customer version valid at order time.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_version_key
        tests: [not_null]
      - name: product_name
        tests: [not_null]
